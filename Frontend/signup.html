<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - TaskFlow</title>
  <link rel="stylesheet" href="signup.css">
</head>
<body>
<!-- Logo in top left -->
<div class="top-logo" onclick="goToLanding()">
  <span class="logo-text">TaskFlow</span>
  <span class="logo-subtitle">Universe</span>
</div>

<!-- Animated background particles -->
<div class="particles" id="particles"></div>

<div class="signup-container">
  <h1 class="welcome">Join TaskFlow</h1>
  <p class="subtitle">Create your account to get started</p>

  <form id="signupForm">
    <div class="form-group">
      <input type="text" placeholder="Full name" required>
      <span class="input-icon">👤</span>
    </div>

    <div class="form-group">
      <input type="email" placeholder="Email address" required>
      <span class="input-icon">📧</span>
    </div>

    <div class="form-group">
      <input type="password" placeholder="Password" required>
      <span class="input-icon">🔒</span>
    </div>

    <div class="form-group">
      <input type="password" placeholder="Confirm password" required>
      <span class="input-icon">🔐</span>
    </div>

    <div class="password-strength">
      <div class="strength-bar">
        <div class="strength-fill"></div>
      </div>
      <span class="strength-text">Password strength</span>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="terms" required>
      <label for="terms">I agree to the <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a></label>
    </div>

    <button type="submit" class="signup-btn">
      <div class="spinner"></div>
      <span class="btn-text">Create Account</span>
    </button>
  </form>

  <div class="social-divider">
    <span>or sign up with</span>
  </div>

  <button class="social-btn" onclick="handleSocialSignup('google')">
    🔍 Sign up with Google
  </button>

  <p class="login-text">
    Already have an account? <a href="index.html" id="signInLink">Sign in</a>
  </p>
</div>

<script src="signup.js"></script>
</body>
</html>
